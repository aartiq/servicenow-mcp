# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
# ServiceNow MCP Server (NowAIKit) — stdio, runs the published npm package.

startCommand:
  type: stdio
  configSchema:
    # JSON Schema for the config Smithery collects and passes to commandFunction.
    type: object
    required:
      - instanceUrl
      - authMethod
    properties:
      instanceUrl:
        type: string
        description: Your ServiceNow instance URL, no trailing slash (e.g. https://yourcompany.service-now.com)
      authMethod:
        type: string
        enum: [basic, oauth]
        default: basic
        description: How to authenticate with ServiceNow
      basicUsername:
        type: string
        description: ServiceNow username (basic auth)
      basicPassword:
        type: string
        description: ServiceNow password (basic auth)
      oauthClientId:
        type: string
        description: OAuth application client ID
      oauthClientSecret:
        type: string
        description: OAuth application client secret
      oauthUsername:
        type: string
        description: Service account username (OAuth password grant)
      oauthPassword:
        type: string
        description: Service account password (OAuth password grant)
      toolPackage:
        type: string
        default: full
        description: Role-based tool package (full, service_desk, change_coordinator, platform_developer, system_administrator, itom_engineer, agile_manager, ai_developer)
      writeEnabled:
        type: boolean
        default: false
        description: Allow create, update and delete operations (read-only by default)
  commandFunction:
    # Produces the CLI command Smithery runs to start the server over stdio.
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '-p', 'nowaikit', 'nowaikit-mcp'],
      env: {
        SERVICENOW_INSTANCE_URL: config.instanceUrl,
        SERVICENOW_AUTH_METHOD: config.authMethod,
        SERVICENOW_BASIC_USERNAME: config.basicUsername || '',
        SERVICENOW_BASIC_PASSWORD: config.basicPassword || '',
        SERVICENOW_OAUTH_CLIENT_ID: config.oauthClientId || '',
        SERVICENOW_OAUTH_CLIENT_SECRET: config.oauthClientSecret || '',
        SERVICENOW_OAUTH_USERNAME: config.oauthUsername || '',
        SERVICENOW_OAUTH_PASSWORD: config.oauthPassword || '',
        MCP_TOOL_PACKAGE: config.toolPackage || 'full',
        WRITE_ENABLED: String(config.writeEnabled === true)
      }
    })
  exampleConfig:
    instanceUrl: https://acme.service-now.com
    authMethod: basic
    basicUsername: mcp.integration
    basicPassword: example-password-change-me
    toolPackage: full
    writeEnabled: false
